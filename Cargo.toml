[package]
name = "homelab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A homelab dashboard for your terminal: tailnet machines and service health, served over SSH."
license = "MIT"
repository = "https://github.com/blakster/homelab"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
rand = "0.10.4"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false }
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.2.2"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"

[features]
default = ["dev-fixtures"]
# `--data <set>` fixtures. Release installs build with --no-default-features.
dev-fixtures = []

[profile.release]
strip = true
lto = "thin"
